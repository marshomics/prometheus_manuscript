  - bioconductor-treeio=1.26.0
  - bioconductor-tidytree=0.4.6
  - r-ggplot2=3.5.1
  - r-ggnewscale=0.4.10
  - r-patchwork=1.2.0
  - r-cowplot=1.1.3
  - r-svglite=2.1.3
  - r-ragg=1.3.2
  - r-systemfonts=1.1.0
  # data wrangling
  - r-dplyr=1.1.4
  - r-tidyr=1.3.1
  - r-readr=2.1.5
  - r-stringr=1.5.1
  - r-jsonlite=1.8.8
  - r-optparse=1.7.5
