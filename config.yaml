# =====================================================================
# Prometheus-in-archaea pipeline — main configuration
# Every default here is chosen for defensibility; see README §"Decisions".
# Paths are relative to the workflow working directory unless absolute.
# =====================================================================

# ---- Inputs -----------------------------------------------------------
samples: "config/samples.tsv"        # one row per genome (+ provenance)
metadata: "config/metadata.tsv"      # ecological metadata, keyed by genome_id
genomes_dir: "resources/genomes"     # nucleotide assemblies live here
genome_extension: "fna"              # {genomes_dir}/{genome_id}.{extension}

results_dir: "results"
logs_dir: "logs"
seed: 12345                          # global RNG seed for reproducibility

# ---- Reference databases (provide these; see resources/README.md) -----
db:
  checkm2: "resources/db/checkm2/uniref100.KO.1.dmnd"
  gtdbtk_data: "resources/db/gtdbtk"           # GTDB-Tk reference data dir
  pfam_hmm: "resources/db/pfam/Pfam-A.hmm"     # pressed Pfam-A (hmmpress)
  interproscan: ""                              # optional: path to interproscan.sh
  kofam_profiles: "resources/db/kofam/profiles"
  kofam_ko_list: "resources/db/kofam/ko_list"
  genomad: "resources/db/genomad_db"
  checkv: "resources/db/checkv-db"

# ---- Reference sequence sets (provide these; see resources/README.md) --
refs:
  prometheus_faa: "resources/refs/prometheus_reference.faa"   # validated Prometheus (incl. P. aeruginosa, van den Berg 2024); used for the validation tree
  paralog_faa: "resources/refs/paralog_reference.faa"         # housekeeping outgroup: DNA2, NurA, HerA, other helicase-nucleases
  mcr_hmm_dir: "resources/refs/mcr_hmm"                       # mcrA/mcrB/mcrG profile HMMs (KOfam or TIGRFAM)
  mcrA_ref_aln: "resources/refs/mcrA_reference.afa"           # curated McrA alignment incl. ANME references
  mcrA_ref_labels: "resources/refs/mcrA_reference_labels.tsv" # ref_id<TAB>group(methanogen|ANME|other)

# ---- Quality control --------------------------------------------------
qc:
  completeness_floor: 50.0       # genomes below this are excluded from primary presence/absence
  contamination_ceiling: 10.0    # genomes above this are excluded from primary presence/absence
  tier_high_completeness: 90.0   # MIMAG "high-quality" threshold for tier A genomes
  tier_high_contamination: 5.0
  prodigal_mode: "single"        # consistent gene calls; "meta" only if many short contigs

# ---- Dereplication ----------------------------------------------------
dereplicate: true                # set false if assemblies are already GTDB species reps
drep_ani: 0.95                   # secondary ANI; 0.95 == species

# ---- Prometheus identification & validation ---------------------------
prometheus:
  # Detection comes ONLY from DefenseFinder's Prometheus calls (no HMM sweep, no PADLOC).
  run_defensefinder: true              # run DefenseFinder under a pinned version (false = ingest provided outputs)
  defensefinder_provided_dir: "resources/defensefinder"   # used only when run_defensefinder: false
  defensefinder_system: "Prometheus"   # system name to extract from DefenseFinder output
  min_len_aa: 800                      # length sanity bounds (canonical ~2221 aa)
  max_len_aa: 3000
  # Domain architecture is detected by NAME from InterProScan/Pfam output
  # (robust to Pfam release drift). Accessions optional; VERIFY against your release.
  domains:
    DUF4011:  { names: ["DUF4011"], accessions: ["PF13195"] }
    DUF3320:  { names: ["DUF3320"], accessions: [] }            # detect by name; verify accession
    DNA2:     { names: ["DNA2", "AAA", "PIF1", "helicase"], accessions: [] }
    nuclease: { names: ["RecB", "PD-(D/E)XK", "nuclease"], accessions: [] }
    REase:    { names: ["restriction", "REase", "MTES", "endonuclease"], accessions: [] }
  context_window: 10                   # +/- ORFs scanned for defense-island signal

# ---- Diversity --------------------------------------------------------
diversity:
  mmseqs_identities: [0.30, 0.50, 0.70, 0.90]
  mmseqs_coverage: 0.60

# ---- Reference scaffolds ----------------------------------------------
tree:
  scope: "focal"            # "focal" = user genomes only; "domain" = + GTDB references
  marker_set: "ar53"        # GTDB archaeal markers
  gtdbtk_classify_extra: "--skip_ani_screen"   # GTDB-Tk 2.4+; adjust for your version
  # --- rooting (the species tree is rooted before any comparative/ancestral use) ---
  rooting_method: "outgroup"   # "outgroup" (preferred, defensible) | "midpoint" (heuristic fallback)
  outgroup: []                 # genome_ids forming the outgroup clade — SET THIS for a defensible root
  outgroup_taxon: ""           # OR a GTDB taxon (e.g. "p__Altiarchaeota") resolved via the taxonomy table
  iqtree_model: "MFP"       # ModelFinder Plus for the de novo focal tree
  pmsf: true                # two-step PMSF for deep-node robustness
  pmsf_model: "LG+C20+F+G"
  ufboot: 1000
  alrt: 1000

methanogen:
  # "Methanogen" is defined from genes, not taxonomy (methanogens are polyphyletic).
  mcr_kos: ["K00399", "K00401", "K00402"]   # KEGG: K00399=mcrA, K00401=mcrB, K00402=mcrG
  mcr_required: ["K00399"]                   # McrA (K00399) is the diagnostic minimum
  kofam_score_fraction: 0.5                  # accept hits >= fraction * KOfam adaptive threshold
  anme_via_mcrA_tree: true                   # separate methanogens from ANME by McrA placement

# ---- Evolution --------------------------------------------------------
evolution:
  align_tool: "mafft"           # mafft (L-INS-i) for the family; FAMSA fallback for large sets
  trim_tool: "clipkit"          # kpic-smart-gap
  gene_tree_model: "MFP"
  per_domain_trees: true
  reconciliation:
    run_generax: true
    generax_model: "UndatedDTL"
    run_ale: false              # ALE optional (heavier install); GeneRax is primary
  ancestral:
    method: "simmap"            # phytools stochastic mapping (pure R, reproducible)
    nsim: 1000
  selection:
    run: true
    methods: ["FEL", "MEME", "BUSTED", "aBSREL", "RELAX"]
    relax_partition: "methanogen"   # RELAX test set = methanogen branches
    intact_only: true               # restrict dN/dS to catalytically-intact loci

# ---- Ecology ----------------------------------------------------------
ecology:
  envo_map: "config/envo_map.tsv"   # optional curated free-text -> ENVO mapping
  predictors: ["biome_envo", "oxygen", "temp_class", "salinity_class", "host_associated"]
  rloop:
    riz_min_g: 3       # RLFS RIZ: runs of >=3 G
    window: 100        # scan window (bp)
    min_rlfs_score: 1  # minimum RLFS hits to call a provirus "R-loop-prone"

# ---- Statistics -------------------------------------------------------
stats:
  confidence_tiers_primary: ["A"]      # headline analyses; ["A","B"] reported as sensitivity
  fdr_method: "BH"
  phyloglm_btol: 10
  phyloglm_boot: 200

# ---- Plotting (publication-ready, Adobe-Illustrator-editable) ---------
plotting:
  formats: ["png", "svg"]
  dpi: 600
  font_family: "Arial"          # falls back to DejaVu Sans if unavailable
  fallback_font: "DejaVu Sans"
  base_font_size: 7             # pt; journal-figure default
  # SVG keeps text as editable <text> (svg.fonttype=none); PDF/PS embed TrueType (type 42).

# ---- Cluster / resources (Grid Engine; see profiles/sge) --------------
threads:
  small: 1
  medium: 8
  large: 24
