name: prometheus-qc
# Stage-0 gene calling (rule prodigal_genes -> prodigal + rename_prodigal.py, which is
# stdlib-only) and the Snakefile `provenance` rule.
#
# CheckM2 lives in its own environment (checkm2.yaml): bioconda checkm2=1.0.2 requires
# python 3.8 / numpy 1.19.2 / tensorflow 2.4, which cannot be solved together with the
# python 3.11 / numpy 1.26.4 stack used here. drep, barrnap, trnascan-se, assembly-stats,
# seqkit and pyrodigal were never called by any rule and have been removed.
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  - prodigal=2.6.3
  - pandas=2.2.2
  - numpy=1.26.4
