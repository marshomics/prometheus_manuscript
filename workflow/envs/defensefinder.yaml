name: prometheus-defensefinder
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.11
  # Prometheus first appears in defense-finder-models v2.0.0 (absent from <= 1.2.4),
  # and v2.0.0+ models REQUIRE the defense-finder SOFTWARE at >= 2.0.0. Pinning an
  # older binary (e.g. 1.3.0) silently detects zero Prometheus loci. Keep >= 2.0.0.
  - defense-finder>=2.0.0
  - macsyfinder>=2.1.4
  - hmmer=3.4
  - prodigal=2.6.3
  - pandas=2.2.2
  # After env creation, install the PINNED models version (>= 2.0.0, contains
  # Prometheus) instead of a floating update:
  #   defense-finder update                                   # latest models, OR
  #   macsydata install 'defense-finder-models==<prometheus.defensefinder_models_version>'
  # The `defensefinder_check` rule verifies the software version AND that a
  # Prometheus model is installed before any genome is searched.
