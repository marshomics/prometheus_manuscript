$schema: "http://json-schema.org/draft-07/schema#"
description: >
  The single filtered, species-level table (species_metadata.tsv) is both the
  samples sheet and the metadata for the analysis. The only required key is
  genome_id; taxonomy, QC (completeness/contamination/n_contigs/N50), and the
  group_*/niche_* presence-absence columns travel in the same table. MAG/isolate
  genome_type is intentionally absent.
type: object
properties:
  genome_id:
    type: string
    description: Unique genome id; staged at {genomes_dir}/{genome_id}.{extension}
required:
  - genome_id
